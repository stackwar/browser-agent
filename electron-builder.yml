appId: com.juyunying.browser-agent
productName: 聚运赢
directories:
  buildResources: build
extraResources:
  - from: resources/cos-upload
    to: cos-upload
files:
  - out/**
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.gitignore,README.md,electron-builder.yml,tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}"
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: AppImage
  category: Development
